<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfinished Business</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Unfinished Business</h1>
    <p id="subtitle">A tracker for the projects you keep abandoning.</p>

    <button id="enable-notifications">🔔 Enable Reminders</button>
    <p id="notification-hint" style="font-size: 0.85rem; color: #6c6c80; margin-top: 10px;">
        To receive reminders, you must click "Allow" when prompted and keep this tab open.
    </p>

    <hr>

    <h2>Add a New Project</h2>
    <input type="text" id="project-input" placeholder="What did you start today?">
    <button id="add-button">Add Project</button>

    <hr>

    <div id="status-message"></div>

    <h2>Your Projects</h2>
    <ul id="project-list">
        <!-- Projects will appear here -->
    </ul>
    <script src="script.js"></script>
</body>
</html>
